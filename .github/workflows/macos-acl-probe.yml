name: macOS guard ACL probe

on:
  pull_request:
    paths:
      - .github/scripts/guard-open-probe.c
      - .github/scripts/guard-open-probe.py
      - .github/workflows/macos-acl-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-filesystem-acl:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check inherited ACL and locked publication
        run: python3 .github/scripts/guard-open-probe.py
